version: "3.8"
services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    networks:
      - kafkanet

#  kafka-console:
#    image: redpandadata/console:v3.0.0
#    ports:
#      - "8080:8080"
#    environment:
#      KAFKA_BROKERS: "redpanda:9092"
#    depends_on:
#      - redpanda
#    networks:
#      - kafkanet

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-redpanda"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "redpanda:9092"
    depends_on:
      - redpanda
    networks:
      - kafkanet

networks:
  kafkanet:
